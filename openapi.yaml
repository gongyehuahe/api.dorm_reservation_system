openapi: 3.0.0
info:
  title: 宿舍预定系统 API
  description: 宿舍预定系统后端API接口文档
  version: 1.0.0
  contact:
    name: 开发团队
    email: dev@example.com

servers:
  - url: http://localhost:8080
    description: 本地开发服务器
  - url: http://api.dorm.example.com
    description: 生产服务器

components:
  schemas:
    # 基础响应模型
    BaseResponse:
      type: object
      properties:
        success: 
          type: boolean
          description: 操作是否成功
        message: 
          type: string
          description: 操作结果消息
      required: [success, message]
    
    # 学生登录请求
    StudentLoginRequest:
      type: object
      properties:
        student_id: 
          type: string
          description: 学生学号
        password: 
          type: string
          description: 登录密码
      required: [student_id, password]
    
    # 学生登录响应
    StudentLoginResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: 
              type: object
              properties:
                user_info: 
                  type: object
                  properties:
                    student_id: 
                      type: integer
                      description: 学生ID
                    student_number: 
                      type: string
                      description: 学号
                    name: 
                      type: string
                      description: 姓名
                    major: 
                      type: string
                      description: 专业
                    grade: 
                      type: integer
                      description: 年级
                    gender: 
                      type: string
                      description: 性别
                  required: [student_id, student_number, name, major, grade, gender]
                token: 
                  type: string
                  description: 认证令牌
              required: [user_info, token]
          required: [data]
    
    # 管理员登录请求
    AdminLoginRequest:
      type: object
      properties:
        username: 
          type: string
          description: 管理员用户名
        password: 
          type: string
          description: 管理员密码
      required: [username, password]
    
    # 管理员登录响应
    AdminLoginResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: 
              type: object
              properties:
                user_info: 
                  type: object
                  properties:
                    admin_id: 
                      type: integer
                      description: 管理员ID
                    username: 
                      type: string
                      description: 用户名
                  required: [admin_id, username]
                token: 
                  type: string
                  description: 认证令牌
              required: [user_info, token]
          required: [data]
    
    # 宿舍类型详情
    RoomTypeDetail:
      type: object
      properties:
        room_type_id: 
          type: integer
          description: 宿舍类型ID
        room_type: 
          type: string
          description: 宿舍类型描述
        area: 
          type: number
          description: 宿舍面积
        price: 
          type: number
          description: 宿舍价格
        bed_count: 
          type: integer
          description: 床位数
        facilities: 
          type: string
          description: 宿舍设施
    
    # 楼栋信息
    Building:
      type: object
      properties:
        building_id: 
          type: integer
          description: 楼栋ID
        name: 
          type: string
          description: 楼栋名称
        campus: 
          type: string
          description: 校区
        introduction: 
          type: string
          description: 楼栋简介
        gender: 
          type: string
          description: 性别限制
        total_floors: 
          type: integer
          description: 总楼层数
        room_types: 
          type: array
          description: 宿舍类型列表
          items: 
            $ref: '#/components/schemas/RoomTypeDetail'
        created_at: 
          type: string
          format: datetime
          description: 创建时间
        updated_at: 
          type: string
          format: datetime
          description: 更新时间
      required: [building_id, name, gender, total_floors]
    
    # 楼栋列表响应
    BuildingsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: 
              type: array
              items: 
                $ref: '#/components/schemas/Building'
          required: [data]
    
    # 楼层信息
    Floor:
      type: object
      properties:
        floor_id: 
          type: integer
          description: 楼层ID
        building_id: 
          type: integer
          description: 所属楼栋ID
        floor_number: 
          type: integer
          description: 楼层号
        image: 
          type: string
          description: 楼层图片URL
        created_at: 
          type: string
          format: datetime
          description: 创建时间
        updated_at: 
          type: string
          format: datetime
          description: 更新时间
      required: [floor_id, building_id, floor_number]
    
    # 楼层列表响应
    FloorsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: 
              type: array
              items: 
                $ref: '#/components/schemas/Floor'
          required: [data]
    
    # 设施信息
    Facility:
      type: object
      properties:
        facility_id: 
          type: integer
          description: 设施ID
        facility_name: 
          type: string
          description: 设施名称
        facility_desc: 
          type: string
          description: 设施描述
      required: [facility_id, facility_name]
    
    # 房间类型
    RoomType:
      type: object
      properties:
        room_type_id: 
          type: integer
          description: 房间类型ID
        introduction: 
          type: string
          description: 房间类型简介
        area: 
          type: number
          description: 房间面积
        price: 
          type: number
          description: 房间价格
        sketch_image: 
          type: string
          description: 床位示意图URL
        real_image: 
          type: string
          description: 房间实景图URL
      required: [room_type_id, introduction, area, price]
    
    # 房间信息
    Room:
      type: object
      properties:
        room_id: 
          type: integer
          description: 房间ID
        floor_id: 
          type: integer
          description: 所属楼层ID
        room_number: 
          type: string
          description: 房间号
        status: 
          type: string
          description: 房间状态
          enum: [可预定, 已被预定, 不可预定]
        room_type: 
          $ref: '#/components/schemas/RoomType'
        features: 
          type: array
          items: 
            $ref: '#/components/schemas/Facility'
        created_at: 
          type: string
          format: datetime
          description: 创建时间
        updated_at: 
          type: string
          format: datetime
          description: 更新时间
      required: [room_id, floor_id, room_number, status]
    
    # 房间列表响应
    RoomsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: 
              type: array
              items: 
                $ref: '#/components/schemas/Room'
          required: [data]
    
    # 床位信息
    Bed:
      type: object
      properties:
        bed_id: 
          type: integer
          description: 床位ID
        room_id: 
          type: integer
          description: 所属房间ID
        bed_number: 
          type: integer
          description: 床位号
        status: 
          type: string
          description: 床位状态
          enum: [可预定, 已被预定, 不可预定]
        created_at: 
          type: string
          format: datetime
          description: 创建时间
        updated_at: 
          type: string
          format: datetime
          description: 更新时间
      required: [bed_id, room_id, bed_number, status]
    
    # 床位列表响应
    BedsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: 
              type: array
              items: 
                $ref: '#/components/schemas/Bed'
          required: [data]
    
    # 预定请求
    BookingRequest:
      type: object
      properties:
        student_id: 
          type: integer
          description: 学生ID
        bed_id: 
          type: integer
          description: 床位ID
      required: [student_id, bed_id]
    
    # 预定响应
    BookingResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: 
              type: object
              properties:
                booking_id: 
                  type: integer
                  description: 预定ID
              required: [booking_id]
          required: [data]
    
    # 预定历史记录
    BookingHistory:
      type: object
      properties:
        booking_id: 
          type: integer
          description: 预定ID
        booking_status: 
          type: string
          description: 预定状态
          enum: [已预定, 已取消, 已入住, 已离开]
        created_at: 
          type: string
          format: datetime
          description: 预定时间
        bed: 
          type: object
          properties:
            bed_id: 
              type: integer
              description: 床位ID
            bed_number: 
              type: integer
              description: 床位号
        room: 
          type: object
          properties:
            room_id: 
              type: integer
              description: 房间ID
            room_number: 
              type: string
              description: 房间号
        floor: 
          type: object
          properties:
            floor_id: 
              type: integer
              description: 楼层ID
            floor_number: 
              type: integer
              description: 楼层号
        building: 
          type: object
          properties:
            building_id: 
              type: integer
              description: 楼栋ID
            name: 
              type: string
              description: 楼栋名称
    
    # 预定历史响应
    BookingHistoryResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: 
              type: array
              items: 
                $ref: '#/components/schemas/BookingHistory'
            total: 
              type: integer
              description: 总记录数
            page: 
              type: integer
              description: 当前页码
            page_size: 
              type: integer
              description: 每页记录数
          required: [data, total, page, page_size]
    
    # 管理员获取学生列表响应
    AdminStudentsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: 
              type: object
              properties:
                data_list: 
                  type: array
                  items: 
                    type: object
                    properties:
                      student_id: 
                        type: integer
                      student_number: 
                        type: string
                      name: 
                        type: string
                      major_id: 
                        type: integer
                      major_name: 
                        type: string
                      grade: 
                        type: integer
                      gender: 
                        type: string
            total: 
              type: integer
            page: 
              type: integer
            page_size: 
              type: integer
          required: [data, total, page, page_size]
    
    # 批量导入学生请求
    BatchStudentsRequest:
      type: object
      properties:
        students: 
          type: array
          items: 
            type: object
            properties:
              student_id: 
                type: string
              name: 
                type: string
              major_id: 
                type: integer
              grade: 
                type: integer
              gender: 
                type: string
            required: [student_id, name, major_id, grade, gender]
      required: [students]
    
    # 批量导入学生响应
    BatchStudentsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: 
              type: object
              properties:
                imported: 
                  type: integer
                failed: 
                  type: integer
                errors: 
                  type: array
                  items: 
                    type: string
              required: [imported, failed]
          required: [data]
    

    
    # 管理员获取预约列表响应
    AdminBookingsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: 
              type: object
              properties:
                data_list: 
                  type: array
                  items: 
                    $ref: '#/components/schemas/BookingHistory'
            total: 
              type: integer
            page: 
              type: integer
            page_size: 
              type: integer
          required: [data, total, page, page_size]
    
    # 时间设置
    TimeSettings:
      type: object
      properties:
        booking_start_time: 
          type: string
          format: datetime
        booking_end_time: 
          type: string
          format: datetime
        modify_time: 
          type: string
          format: datetime
      required: [booking_start_time, booking_end_time, modify_time]
    
    # 时间设置响应
    TimeSettingsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data: 
              $ref: '#/components/schemas/TimeSettings'
          required: [data]
    
    # 更新时间设置请求
    UpdateTimeSettingsRequest:
      type: object
      properties:
        booking_start_time: 
          type: string
          format: datetime
        booking_end_time: 
          type: string
          format: datetime
      required: [booking_start_time, booking_end_time]
    
    # 错误响应
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            code: 
              type: integer
              description: 错误码
            details: 
              type: string
              description: 错误详情
  
paths:
  # 学生端 API
  /api/check-login-time:
    get:
      summary: 检查登录时间
      description: 检查当前时间是否在可登录范围内
      operationId: controllers.default_controller.api_check_login_time
      responses:
        '200':
          description: 成功获取登录时间检查结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      allow_login:
                        type: boolean
                        description: 是否允许登录
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/students/login:
    post:
      summary: 学生登录
      description: 学生登录
      operationId: controllers.default_controller.api_students_login_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentLoginResponse'
        '401':
          description: 登录失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  
  /api/students/information:
    get:
      summary: 获取学生选宿倾向
      description: 获取学生选宿倾向
      operationId: controllers.default_controller.api_students_information_get
      parameters:
        - name: student_id
          in: query
          required: true
          schema:
            type: integer
          description: 学生ID
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          information:
                            type: string
                            description: 学生选宿倾向
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '404':
          description: 学生不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
    put:
      summary: 更新学生选宿倾向
      description: 更新学生选宿倾向
      operationId: controllers.default_controller.api_students_information_put
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                student_id:
                  type: integer
                  description: 学生ID
                information:
                  type: string
                  description: 选宿倾向
                  maxLength: 255
              required:
                - student_id
                - information
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '404':
          description: 学生不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/students/recommend-dormitory:
    put:
      summary: 推荐宿舍
      description: 根据学生选宿倾向推荐宿舍，并更新学生的room_id字段
      operationId: controllers.default_controller.api_students_recommend_dormitory_put
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                student_id:
                  type: integer
                  description: 学生ID
              required:
                - student_id
      responses:
        '200':
          description: 推荐成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          room_id:
                            type: integer
                            description: 推荐的宿舍ID
                          building_name:
                            type: string
                            description: 宿舍楼名称
                          floor_number:
                            type: integer
                            description: 楼层
                          room_number:
                            type: string
                            description: 宿舍号
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '404':
          description: 学生不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  
  /api/buildings:
    get:
      summary: 获取楼栋列表
      description: 根据用户性别获取可用的楼栋列表
      operationId: controllers.default_controller.api_buildings_get
      parameters:
        - name: gender
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 成功获取楼栋列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingsResponse'
  
  /api/floors:
    get:
      summary: 获取楼层列表
      description: 根据楼栋ID获取楼层列表
      operationId: controllers.default_controller.api_floors_get
      parameters:
        - name: building_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 成功获取楼层列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloorsResponse'
  
  /api/rooms:
    get:
      summary: 获取房间列表
      description: 根据楼层ID和学生ID获取房间列表
      operationId: controllers.default_controller.api_rooms_get
      parameters:
        - name: floor_id
          in: query
          required: false
          schema:
            type: string
        - name: student_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 成功获取房间列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomsResponse'
  
  /api/rooms/{room_id}:
    get:
      summary: 获取房间详情
      description: 根据房间ID和学生ID获取房间详情
      operationId: controllers.default_controller.api_rooms_room_id_get
      parameters:
        - name: room_id
          in: path
          required: true
          schema:
            type: integer
        - name: student_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 成功获取房间详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '404':
          description: 房间不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/rooms/{room_id}/beds:
    get:
      summary: 获取床位列表
      description: 根据房间ID和学生ID获取床位列表
      operationId: controllers.default_controller.api_rooms_room_id_beds_get
      parameters:
        - name: room_id
          in: path
          required: true
          schema:
            type: integer
        - name: student_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 成功获取床位列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedsResponse'
  
  /api/bookings:
    post:
      summary: 提交预定
      description: 学生提交宿舍床位预定
      operationId: controllers.default_controller.api_bookings_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '200':
          description: 预定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/bookings/cancel:
    post:
      summary: 取消预定
      description: 学生取消已预订的宿舍床位
      operationId: controllers.default_controller.api_bookings_cancel_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                booking_id:
                  type: integer
                  description: 预定ID
              required: [booking_id]
      responses:
        '200':
          description: 取消预定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/change-password:
    post:
      summary: 修改密码
      description: 学生修改登录密码
      operationId: controllers.default_controller.api_change_password_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                student_id:
                  type: string
                  description: 学生学号
                old_password:
                  type: string
                  description: 原密码
                new_password:
                  type: string
                  description: 新密码
              required: [student_id, old_password, new_password]
      responses:
        '200':
          description: 密码修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '401':
          description: 原密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '404':
